<button dhButton type="button" size="sm" (click)="openPicker()">
  {{ 'columnPicker.button' | translate }}
</button>

<dh-dialog
  [(open)]="open"
  [label]="'columnPicker.title' | translate"
  [closeLabel]="'columnPicker.close' | translate"
>
  <p class="dh-columns__hint">
    {{ 'columnPicker.hint' | translate }}
  </p>
  <ol class="dh-columns__list">
    @for (choice of draft(); track choice.key; let i = $index, last = $last) {
      @let label = columnLabelKey(choice.key) | translate;
      <li class="dh-columns__item">
        <label class="dh-columns__toggle">
          <input
            type="checkbox"
            [checked]="choice.visible"
            [disabled]="choice.key === pinned"
            (change)="toggle(choice.key)"
          />
          {{ label }}
        </label>
        @if (choice.key !== pinned) {
          <span class="dh-columns__moves">
            <button
              dhButton
              type="button"
              size="sm"
              variant="ghost"
              [id]="moveId(choice.key, 'up')"
              [disabled]="i <= 1"
              [attr.aria-label]="'columnPicker.moveUp' | translate: { label }"
              (click)="move(i, -1)"
            >
              <span aria-hidden="true">↑</span>
            </button>
            <button
              dhButton
              type="button"
              size="sm"
              variant="ghost"
              [id]="moveId(choice.key, 'down')"
              [disabled]="last"
              [attr.aria-label]="'columnPicker.moveDown' | translate: { label }"
              (click)="move(i, 1)"
            >
              <span aria-hidden="true">↓</span>
            </button>
          </span>
        }
      </li>
    }
  </ol>
  <div dhDialogFooter class="dh-columns__footer">
    <button dhButton type="button" variant="ghost" (click)="resetToDefault()">
      {{ 'columnPicker.reset' | translate }}
    </button>
    <span class="dh-columns__spacer"></span>
    <button dhButton type="button" (click)="open.set(false)">
      {{ 'columnPicker.cancel' | translate }}
    </button>
    <button dhButton type="button" variant="primary" (click)="applyChanges()">
      {{ 'columnPicker.apply' | translate }}
    </button>
  </div>
</dh-dialog>
