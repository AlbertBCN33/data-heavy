<!--
  The click handler only detects backdrop clicks (a mouse convenience). Its keyboard equivalent is
  Escape, which the native modal dialog already handles; the dialog itself must not be focusable.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="dh-dialog"
  [class.dh-dialog--drawer]="variant() === 'drawer'"
  [attr.aria-labelledby]="headingId"
  (close)="onNativeClose()"
  (click)="onDialogClick($event)"
>
  <div class="dh-dialog__surface">
    <header class="dh-dialog__header">
      <h2 class="dh-dialog__title" [id]="headingId">{{ label() }}</h2>
      <button
        dhButton
        variant="ghost"
        size="sm"
        type="button"
        class="dh-dialog__close"
        (click)="open.set(false)"
      >
        <span aria-hidden="true">✕</span>
        <span class="dh-dialog__sr-only">{{ closeLabel() }}</span>
      </button>
    </header>
    <div class="dh-dialog__body">
      <ng-content />
    </div>
    <ng-content select="[dhDialogFooter]" />
    <!-- The page is inert while this dialog is open: toasts render here instead (see ToastOutlet). -->
    @if (shown()) {
      <dh-toast-outlet scope="modal" />
    }
  </div>
</dialog>
