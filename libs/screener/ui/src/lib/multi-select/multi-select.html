<span class="dh-multi-select__label" [id]="labelId">{{ label() }}</span>

<div
  #combobox="ngCombobox"
  ngCombobox
  class="dh-multi-select__trigger"
  [(expanded)]="expanded"
  [preserveContent]="true"
  [attr.aria-labelledby]="labelId"
>
  <span
    class="dh-multi-select__value"
    [class.dh-multi-select__value--placeholder]="value().length === 0"
    >{{ summary() }}</span
  >
  <span class="dh-multi-select__chevron" aria-hidden="true"></span>
</div>

<ng-template
  [cdkConnectedOverlay]="{
    origin: combobox.element,
    usePopover: 'inline',
    matchWidth: true,
  }"
  [cdkConnectedOverlayOpen]="expanded()"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div class="dh-multi-select__popup">
      <div
        #listbox="ngListbox"
        ngListbox
        ngComboboxWidget
        class="dh-multi-select__listbox"
        focusMode="activedescendant"
        selectionMode="explicit"
        [multi]="true"
        [tabindex]="-1"
        [attr.aria-labelledby]="labelId"
        [value]="selection()"
        (valueChange)="onSelectionChange($event)"
        [activeDescendant]="listbox.activeDescendant()"
      >
        @for (option of options(); track option.value) {
          <div
            ngOption
            class="dh-multi-select__option"
            [value]="option.value"
            [label]="option.label"
          >
            <span class="dh-multi-select__check" aria-hidden="true"></span>
            <span>{{ option.label }}</span>
          </div>
        }
      </div>
    </div>
  </ng-template>
</ng-template>
