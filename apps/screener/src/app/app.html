<a class="skip-link" href="#main">Skip to main content</a>
<header class="app-header">
  <span class="app-title">Market Screener</span>
  <nav class="app-nav" aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="app-nav__link--active"
      ariaCurrentWhenActive="page"
      class="app-nav__link"
      [routerLinkActiveOptions]="screenerActiveOptions"
      >Screener</a
    >
    <a
      routerLink="/watchlist"
      routerLinkActive="app-nav__link--active"
      ariaCurrentWhenActive="page"
      class="app-nav__link"
      >Watchlist</a
    >
  </nav>
</header>
<!-- Always in the DOM so the message is announced when it appears. -->
<div class="app-offline" role="status">
  @if (!network.online()) {
    <p class="app-offline__message">
      You're offline. Showing data saved on this device; watchlist changes will
      be saved when you reconnect.
    </p>
  }
</div>
<main id="main" class="app-main" tabindex="-1">
  <router-outlet />
</main>
<dh-toast-outlet />
